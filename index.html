<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>어원 단어 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a student's study notebook. One word card, morpheme blocks as the hero, then seven notebook sections in the order the teacher teaches them. */
:root{
  --bg:#eef2f6; --paper:#ffffff; --ink:#1d2a44; --muted:#5b6780; --line:#d5dde8;
  --pre:#ffd95e; --root:#7fdcc0; --suf:#ffb3c7; --accent:#2f5bd3; --accent-ink:#ffffff;
  --soft:#e3ebf7; --warn:#b4472b;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121826; --paper:#1b2335; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2c3750;
  --pre:#c9a632; --root:#3fae90; --suf:#c9708a; --accent:#7ea2ff; --accent-ink:#0e1424;
  --soft:#243049; --warn:#f08a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121826; --paper:#1b2335; --ink:#e7ecf6; --muted:#9aa6bf; --line:#2c3750;
  --pre:#c9a632; --root:#3fae90; --suf:#c9708a; --accent:#7ea2ff; --accent-ink:#0e1424;
  --soft:#243049; --warn:#f08a6c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.9rem}
.sub{color:var(--muted);margin:4px 0 0}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px;min-width:0;font:600 1.1rem var(--f-mono);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.search input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-family:var(--f-display);font-size:1.05rem}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.85rem;color:var(--muted);margin-right:4px}
.chip{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);padding:4px 12px;font:600 .9rem var(--f-mono);border-radius:999px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.note{font-size:.9rem;color:var(--muted)}
.note.err{color:var(--warn)}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:28px}
.hero{display:flex;flex-direction:column;gap:12px}
.hero .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero .w{font:600 2.4rem/1.1 var(--f-mono);letter-spacing:.01em;word-break:break-word}
.hero .pos{font-size:.9rem;color:var(--muted)}
.hero .mean{font-family:var(--f-display);font-size:1.3rem}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.blk{border-radius:10px;padding:8px 14px 10px;display:flex;flex-direction:column;align-items:center;min-width:84px;color:#1d2a44}
.blk.prefix{background:var(--pre)} .blk.root{background:var(--root)} .blk.suffix{background:var(--suf)}
.blk b{font:600 1.5rem var(--f-mono)}
.blk .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-mono);opacity:.8}
.blk .m{font-size:.92rem;text-align:center}
.blk .o{font-size:.75rem;opacity:.8;text-align:center}
.plus{align-self:center;font:600 1.3rem var(--f-mono);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

section.sec{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:20px}
.sec h2{font-size:1.35rem;display:flex;gap:10px;align-items:center}
.sec h2 .n{font:600 .8rem var(--f-mono);background:var(--soft);color:var(--accent);border-radius:6px;padding:2px 8px}
.talk{display:flex;gap:12px;align-items:flex-start}
.talk .face{flex:0 0 42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);color:var(--accent)}
.talk p{margin:0;background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 14px;max-width:62ch;min-width:0}
.derivs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.d{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.d .dw{font:600 1.1rem var(--f-mono)} .d .dm{color:var(--muted);font-size:.9rem}
.d .ex{margin:4px 0 0;font-family:var(--f-mono);font-size:.9rem;line-height:1.5}
.d .exk{margin:0;font-size:.85rem;color:var(--muted)}
.d mark{background:var(--root);color:#1d2a44;border-radius:3px;padding:0 2px}
.pic{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.pic .frame{flex:0 1 300px;max-width:100%;aspect-ratio:3/2;background:var(--soft);border-radius:14px;display:grid;place-items:center;overflow:hidden}
.pic .frame svg,.pic .frame img{width:100%;height:100%}
.pic .side{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.s-ink{fill:var(--ink)} .s-a{fill:var(--pre)} .s-b{fill:var(--accent)} .s-c{fill:var(--suf)} .s-r{fill:var(--root)} .s-bg{fill:var(--paper)} .s-soft{fill:var(--line)}
.st-ink{stroke:var(--ink)}
.vids{display:flex;flex-direction:column;gap:8px}
.vid{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);text-decoration:none;flex-wrap:wrap}
.vid:hover{border-color:var(--accent)}
.vid .q{font:600 1rem var(--f-mono);min-width:0;word-break:break-word}
.vid .go{color:var(--accent);font-size:.9rem;white-space:nowrap}
.story{background:var(--soft);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.story h3{font-size:1.25rem}
.story p{margin:0;font-size:1.05rem;line-height:1.9;max-width:62ch}
.story .en{font-family:var(--f-mono);font-weight:600;background:var(--pre);color:#1d2a44;border-radius:4px;padding:0 4px}
.story .ko{color:var(--muted)}
.count{font:.8rem var(--f-mono);color:var(--muted)}
.tag{font:.75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
a{color:var(--accent)}
@media (max-width:480px){.hero .w{font-size:1.9rem}.blk{min-width:70px;padding:6px 10px}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .35s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>어원 단어 교실</h1>
    <p class="sub">수능 영어 단어를 넣으면 조각조각 나눠서, 뿌리부터 이야기처럼 알려 줄게요.</p>
  </header>

  <form class="search" id="f" autocomplete="off">
    <input id="q" type="text" placeholder="예: transport, inspect, describe" aria-label="영어 단어" spellcheck="false">
    <button class="btn" id="go" type="submit">알아보기</button>
    <button class="btn ghost" id="stop" type="button" hidden>그만</button>
  </form>
  <div class="chips" id="chips"><span class="lbl">예시 단어</span></div>
  <div class="status"><span class="note" id="msg"></span></div>

  <article class="card" id="card" aria-live="polite"></article>
  <p class="note">수능 단어 사전에 있는 단어는 바로 보여 줘요. 사전에 없는 단어는 AI가 그 자리에서 만들고, 이 브라우저에 저장해 둬요.</p>
</div>

<script src="prompt.js"></script>
<script>
const SVG = {

inspect:`<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="발자국을 살피는 돋보기"><ellipse class="s-c" cx="58" cy="128" rx="10" ry="15"/><ellipse class="s-c" cx="84" cy="112" rx="10" ry="15"/><circle class="s-bg" cx="108" cy="70" r="44"/><ellipse class="s-c" cx="98" cy="84" rx="12" ry="18"/><ellipse class="s-c" cx="122" cy="58" rx="12" ry="18"/><circle cx="108" cy="70" r="44" fill="none" class="st-ink" stroke-width="9"/><path class="st-ink" d="M140 102l50 46" stroke-width="16" stroke-linecap="round"/><path d="M84 50a30 30 0 0 1 22-14" fill="none" style="stroke:var(--root)" stroke-width="5" stroke-linecap="round"/></svg>`
};

const PRESET = [
{word:"transport",pos:"동사·명사",meaning:"실어 나르다, 운송(하다), 교통",
 parts:[{text:"trans",type:"prefix",origin:"라틴어 trans",meaning:"건너서, 저쪽으로"},{text:"port",type:"root",origin:"라틴어 portare",meaning:"나르다"}],
 rootTalk:"trans는 '건너편으로', port는 '나르다'라는 뜻이에요. 둘을 붙이면 '저쪽으로 실어 나르다'! 트럭이 짐을 싣고 강 건너 도시로 가는 모습을 떠올리면 딱이에요. port가 보이면 일단 '나른다'를 떠올려 보세요.",
 history:"로마 사람들은 길을 아주 잘 닦았어요. 그 길로 곡식과 물건을 제국 곳곳에 portare(나르다) 했죠. 호텔에서 가방을 들어 주는 사람을 porter라고 부르는 것도 '나르는 사람'이라서예요. 2천 년 전 로마의 말이 오늘날 버스·지하철을 뜻하는 transport가 된 거예요.",
 derivatives:[
  {word:"transportation",meaning:"교통, 운송",example:"Buses are cheap public transportation in Seoul.",exampleKo:"버스는 서울에서 값싼 대중교통이에요."},
  {word:"import",meaning:"수입하다 (안으로 나르다)",example:"Korea imports a lot of bananas.",exampleKo:"한국은 바나나를 많이 수입해요."},
  {word:"export",meaning:"수출하다 (밖으로 나르다)",example:"Korea exports cars to many countries.",exampleKo:"한국은 여러 나라에 자동차를 수출해요."},
  {word:"report",meaning:"보고(하다) (소식을 다시 날라 오다)",example:"I wrote a report about my weekend.",exampleKo:"나는 주말에 대한 보고서를 썼어요."},
  {word:"support",meaning:"지지하다, 받치다 (아래에서 나르다)",example:"My parents always support me.",exampleKo:"부모님은 항상 나를 응원해 주세요."},
  {word:"portable",meaning:"들고 다닐 수 있는",example:"This portable speaker is small and light.",exampleKo:"이 휴대용 스피커는 작고 가벼워요."},
  {word:"porter",meaning:"짐꾼, 짐 들어 주는 사람",example:"The porter carried our bags to the room.",exampleKo:"짐꾼이 우리 가방을 방까지 옮겨 줬어요."}],
 phrases:["transport","public transport","transport it"],
 story:{title:"이삿날의 수상한 피아노",text:"민수는 이삿날 피아노를 혼자 transport(옮기다)하겠다고 큰소리쳤어요. \"이건 portable(들고 다닐 수 있는) 피아노야!\" 친구들이 옆에서 support(받치다)했지만 피아노는 꿈쩍도 안 했죠. 결국 porter(짐꾼) 아저씨를 불렀는데, 아저씨가 한 손으로 번쩍! 모두 깜짝 놀라 엄마에게 report(보고하다)하려는 순간, 아저씨가 웃었어요. \"이거 장난감 피아노잖아.\""}},
{word:"export",pos:"동사·명사",meaning:"수출하다, 수출(품), (파일을) 내보내다",
 parts:[{text:"ex",type:"prefix",origin:"라틴어 ex",meaning:"밖으로"},{text:"port",type:"root",origin:"라틴어 portare",meaning:"나르다"}],
 rootTalk:"ex는 '밖으로', port는 '나르다'예요. 나라 밖으로 실어 나르니까 '수출하다'! 반대로 im(안으로)을 붙이면 import, '수입하다'가 돼요. 컴퓨터에서 파일을 '내보내기' 할 때도 export라고 하니까 같이 기억해 두세요.",
 history:"로마 시대에도 사람들은 올리브기름과 포도주를 항아리에 담아 배에 싣고 지중해 곳곳으로 export 했어요. 오늘날 한국은 반도체와 자동차는 물론 라면과 K-팝 앨범까지 세계로 export 하는 나라예요. 물건이 '밖으로 나가는' 길은 2천 년 전이나 지금이나 바다랍니다.",
 derivatives:[
  {word:"exporter",meaning:"수출국, 수출하는 회사",example:"Korea is a big exporter of phones.",exampleKo:"한국은 휴대폰을 많이 수출하는 나라예요."},
  {word:"import",meaning:"수입하다 (안으로 나르다)",example:"We import coffee from Brazil.",exampleKo:"우리는 브라질에서 커피를 수입해요."},
  {word:"transport",meaning:"실어 나르다 (건너편으로 나르다)",example:"Ships transport cars to other countries.",exampleKo:"배가 다른 나라로 자동차를 실어 날라요."},
  {word:"report",meaning:"보고(하다), 보도 (소식을 다시 날라 오다)",example:"The news report was about Korean ramen.",exampleKo:"그 뉴스 보도는 한국 라면에 대한 거였어요."},
  {word:"support",meaning:"응원하다, 받치다 (아래에서 나르다)",example:"Many fans support Korean singers.",exampleKo:"많은 팬이 한국 가수를 응원해요."},
  {word:"portable",meaning:"들고 다닐 수 있는",example:"I take my portable charger everywhere.",exampleKo:"나는 보조배터리를 어디든 가지고 다녀요."},

const LS_KEY = "etym-words-v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { saved = {}; }
function persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(saved)); } catch (e) {} }

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const TYPE_KO = {prefix:"접두사", root:"어근", suffix:"접미사"};

function allWords(){ return [...PRESET.map(w => w.word), ...Object.keys(saved).filter(k => !PRESET.some(p => p.word === k))]; }
function find(w){ return PRESET.find(p => p.word === w) || saved[w]; }

function renderChips(active){
  const c = $("#chips"); c.querySelectorAll(".chip").forEach(n => n.remove());
  allWords().forEach(w => {
    const b = el("button", "chip", w); b.type = "button";
    b.setAttribute("aria-pressed", String(w === active));
    b.onclick = () => show(find(w));
    c.append(b);
  });
}

function markWord(sentence, word){
  // highlight the derivative (and simple inflections) inside its example
  const frag = document.createDocumentFragment();
  const stem = word.toLowerCase().replace(/e$/, "");
  const re = new RegExp("\\b(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "i");
  const m = sentence.match(re);
  if (!m) { frag.append(sentence); return frag; }
  frag.append(sentence.slice(0, m.index), el("mark", null, m[1]), sentence.slice(m.index + m[1].length));
  return frag;
}

function storyNodes(text){
  // English(한글) → highlighted pair
  const p = el("p"); const re = /([A-Za-z][A-Za-z'\-]*(?: [A-Za-z][A-Za-z'\-]*)?)\(([^)]{1,30})\)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    p.append(text.slice(last, m.index), el("span", "en", m[1]), el("span", "ko", "(" + m[2] + ")"));
    last = re.lastIndex;
  }
  p.append(text.slice(last)); return p;
}

function section(n, title){
  const s = el("section", "sec"); const h = el("h2"); h.append(el("span", "n", n), title); s.append(h); return s;
}
function talk(text){ const t = el("div", "talk"); t.append(el("div", "face", "쌤"), el("p", null, text)); return t; }

function pictureNode(d){
  const frame = el("div", "frame");
  if (SVG[d.word]) frame.innerHTML = SVG[d.word];                       // our own static drawings
  else if (typeof d.imageSvg === "string" && /^\s*<svg[\s>]/i.test(d.imageSvg) && d.imageSvg.length < 12000) {
    const img = new Image(); img.alt = d.word + "을(를) 나타낸 그림";
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(d.imageSvg); // rendered as an image, so no scripts run
    frame.append(img);
  } else frame.append(el("span", "note", "그림을 만들지 못했어요"));
  return frame;
}

function show(d){
  if (!d) return;
  renderChips(d.word);
  const card = $("#card"); card.replaceChildren();

  // hero: the word broken into blocks
  const hero = el("div", "hero");
  const meta = el("div", "meta"); meta.append(el("span", "w", d.word), el("span", "pos", d.pos || ""));
  if (d.generated) meta.append(el("span", "tag", "AI가 그 자리에서 만든 내용"));
  if (d.certainty === "low") meta.append(el("span", "tag", "어원 학설이 갈리는 단어"));
  hero.append(meta, el("div", "mean", d.meaning || ""));
  const blocks = el("div", "blocks");
  (d.parts || []).forEach((p, i) => {
    if (i) blocks.append(el("span", "plus", "+"));
    const b = el("div", "blk " + (TYPE_KO[p.type] ? p.type : "root"));
    b.append(el("span", "k", TYPE_KO[p.type] || "어근"), el("b", null, p.text), el("span", "m", p.meaning || ""), el("span", "o", p.origin || ""));
    blocks.append(b);
  });
  const lg = el("div", "legend");
  [["접두사","--pre"],["어근","--root"],["접미사","--suf"]].forEach(([t, v]) => { const s = el("span"); const i = el("i"); i.style.background = `var(${v})`; s.append(i, t); lg.append(s); });
  hero.append(blocks, lg);
  card.append(hero);

  // 1 root analysis
  const s1 = section("1", "어근 분석"); s1.append(talk(d.rootTalk || ""));
  const syn = (d.synonyms || []).filter(Boolean), ant = (d.antonyms || []).filter(Boolean);
  if (syn.length || ant.length) {
    const nym = el("p", "note");
    if (syn.length) nym.append("유의어: " + syn.join(", "));
    if (syn.length && ant.length) nym.append(" · ");
    if (ant.length) nym.append("반의어: " + ant.join(", "));
    s1.append(nym);
  }
  card.append(s1);
  // 2 history
  const s2 = section("2", "문화·역사 이야기"); s2.append(talk(d.history || "")); card.append(s2);
  // 3+4 derivatives with A2 examples
  const s3 = section("3·4", "같은 뿌리 단어와 예문");
  s3.append(el("p", "note", "초록색은 오늘의 단어예요."));
  const g = el("div", "derivs");
  (d.derivatives || []).slice(0, 10).forEach(x => {
    const c = el("div", "d"); c.append(el("span", "dw", x.word), el("span", "dm", x.meaning || ""));
    const ex = el("p", "ex"); ex.append(markWord(x.example || "", x.word)); c.append(ex, el("p", "exk", x.exampleKo || ""));
    g.append(c);
  });
  s3.append(g); card.append(s3);
  // 5 picture
  const s5 = section("5", "그림으로 기억하기");
  const pic = el("div", "pic"); const side = el("div", "side");
  side.append(el("p", "note", `'${d.word}'을(를) 한 장면으로 그렸어요. 그림을 보면서 뜻을 소리 내어 말해 보세요.`));
  const more = el("a", null, "실제 사진 더 보기 (Wikimedia Commons)"); more.href = "https://commons.wikimedia.org/w/index.php?search=" + encodeURIComponent(d.word) + "&title=Special:MediaSearch&type=image"; more.target = "_blank"; more.rel = "noopener";
  side.append(more); pic.append(pictureNode(d), side); s5.append(pic); card.append(s5);
  // 6 playphrase
  const s6 = section("6", "영화 속에서 듣기");
  s6.append(el("p", "note", "playphrase.me에서 짧고 쉬운 표현으로 찾아요. 누르면 새 탭에서 영화 장면이 재생돼요."));
  const v = el("div", "vids");
  const qs = [...new Set([d.word, ...(d.phrases || [])].map(s => String(s).trim()).filter(Boolean))].slice(0, 4);
  qs.forEach(q => {
    const a = el("a", "vid"); a.href = "https://www.playphrase.me/#/search?q=" + encodeURIComponent(q); a.target = "_blank"; a.rel = "noopener";
    a.append(el("span", "q", "“" + q + "”"), el("span", "go", "장면 보기 ↗")); v.append(a);
  });
  s6.append(v); card.append(s6);
  // 7 story
  const s7 = section("7", "웃긴 이야기로 외우기");
  const st = el("div", "story"); const txt = (d.story && d.story.text) || "";
  st.append(el("h3", null, (d.story && d.story.title) || "오늘의 이야기"), storyNodes(txt), el("span", "count", `${[...txt].length}/300자`));
  s7.append(st); card.append(s7);
  try { history.replaceState(null, "", "#" + d.word.replace(/[^a-z\-]/g, "")); } catch (e) {}
}

// ---- live generation for any word ----

let samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample") : Promise.resolve(null);

// ---- outside claude.ai: ask our own server (api/word.js), which holds the API key ----
// GitHub Pages나 내 컴퓨터에서 열면 서버가 없으니, Vercel에 올린 주소로 보냄.
const BACKEND = "https://englishstudy.vercel.app";
const onOwnServer = /^https?:$/.test(location.protocol) && !location.hostname.endsWith("github.io");
const API_URL = (onOwnServer ? "" : BACKEND) + "/api/word";
function apiSample(){
  return { json: async (prompt, { signal, word } = {}) => {
    let r;
    try { r = await fetch(API_URL + "?w=" + encodeURIComponent(word), { signal }); }
    catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
    let d = null; try { d = await r.json(); } catch (e) {}
    if (!r.ok) throw { code: (d && d.code) || "api_error" };
    return d;
  }};
}
samplePromise = samplePromise.then(s => s || apiSample());

// 미리 만든 수능 단어 사전(data/words/<단어>.json). 있으면 AI를 부르지 않고 바로 보여 줌.
const DICT_BASE = onOwnServer || location.hostname.endsWith("github.io") ? "data/words/" : BACKEND + "/data/words/";
async function fromDictionary(w){
  try {
    const r = await fetch(DICT_BASE + encodeURIComponent(w) + ".json");
    if (!r.ok) return null;
    const d = await r.json();
    return d && d.word && Array.isArray(d.parts) ? d : null;
  } catch (e) { return null; }
}
let ctl = null;
const msg = (t, err) => { const m = $("#msg"); m.textContent = t; m.classList.toggle("err", !!err); };
const ERR = {
  not_granted:"Claude 사용을 허락하지 않아서 새 단어는 만들 수 없어요. 예시 단어는 계속 볼 수 있어요.",
  sampling_disabled:"이 계정에서는 Claude를 쓸 수 없어요. 예시 단어로 공부해 보세요.",
  rate_limited:"지금 요청이 많아요. 잠시 뒤에 다시 눌러 주세요.",
  session_expired:"로그인이 만료됐어요. 다시 로그인한 뒤 눌러 주세요.",
  invalid_json:"내용을 정리하다 꼬였어요. 한 번 더 눌러 주세요.",
  refused:"이 단어는 만들 수 없어요. 다른 단어로 해 볼까요?",
  server_not_ready:"새 단어를 만드는 서버가 아직 준비되지 않았어요. 예시 단어는 지금도 볼 수 있어요.",
  network:"새 단어를 만드는 서버에 연결하지 못했어요. 잠시 뒤에 다시 눌러 주세요.",
  api_error:"AI 쪽에서 오류가 났어요. 잠시 뒤에 다시 눌러 주세요."
};

async function generate(raw){
  const w = raw.trim().toLowerCase();
  if (!/^[a-z][a-z\-']{1,30}$/.test(w)) { msg("영어 단어 하나를 알파벳으로 넣어 주세요.", true); return; }
  if (find(w)) { show(find(w)); msg(""); return; }
  const fromDict = await fromDictionary(w);
  if (fromDict) { fromDict.word = String(fromDict.word).toLowerCase(); saved[w] = fromDict; persist(); show(fromDict); msg(""); return; }
  const sample = await samplePromise;
  ctl = new AbortController();
  $("#go").disabled = true; $("#stop").hidden = false;
  msg(`'${w}' 뿌리를 캐는 중이에요…`);
  try {
    const d = await sample.json(buildPrompt(w), { signal: ctl.signal, word: w, cache: { gcTime: 86400000 } });
    if (!d || typeof d !== "object") throw { code: "invalid_json" };
    if (d.error) { msg(String(d.error), true); return; }
    if (!d.word || !Array.isArray(d.parts) || !Array.isArray(d.derivatives)) throw { code: "invalid_json" };
    d.word = String(d.word).toLowerCase(); d.generated = true;
    saved[d.word] = d; persist();
    show(d); msg("");
  } catch (e) {
    if (e && e.code === "cancelled") msg("멈췄어요.");
    else msg(ERR[e && e.code] || "연결이 잠깐 끊겼어요. 다시 눌러 주세요.", true);
  } finally { $("#go").disabled = false; $("#stop").hidden = true; ctl = null; }
}

$("#f").addEventListener("submit", ev => { ev.preventDefault(); generate($("#q").value); });
$("#stop").onclick = () => ctl && ctl.abort();

const start = (location.hash || "").slice(1);
show(find(start) || PRESET[0]);
if (start && !find(start)) fromDictionary(start).then(d => { if (d) { saved[start] = d; persist(); show(d); } });
</script>
</body>
</html>
